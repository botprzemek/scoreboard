[package]
name = "scoreboard-worker"
version.workspace = true
edition.workspace = true

[[bin]]
name = "linux"
path = "src/bin/linux.rs"
test = false
doctest = false
bench = false
required-features = ["linux"]

[[bin]]
name = "rp235x"
path = "src/bin/rp235x.rs"
test = false
doctest = false
bench = false
required-features = ["rp235x"]

[[bin]]
name = "esp32s3"
path = "src/bin/esp32s3.rs"
test = false
doctest = false
bench = false
required-features = ["esp32s3"]

[features]
default = []
linux = [
    "critical-section/std",

    "dep:tokio",
]
esp32s3 = [
    "scoreboard-hub75/esp32s3",
    "scoreboard-hub75/w64h32",

    "dep:embassy-executor",
    "dep:embassy-futures",
    "dep:embassy-net",
    "dep:embassy-time",
    "dep:embedded-storage",
    "dep:esp-alloc",
    "dep:esp-bootloader-esp-idf",
    "dep:esp-hal",
    "dep:esp-println",
    "dep:esp-radio",
    "dep:esp-rtos",
    "dep:esp-storage",
    "dep:log",
    "dep:static_cell",
    "embassy-net/medium-ethernet",
    "esp-hal/unstable",
]
rp235x = [
    "scoreboard-basketball/defmt",
    "scoreboard-config/defmt",
    "scoreboard-hub75/rp235x",
    "scoreboard-hub75/w64h32",
    "scoreboard-net/defmt",

    "dep:cortex-m",
    "dep:cortex-m-rt",
    "dep:cyw43",
    "dep:cyw43-pio",
    "dep:defmt",
    "dep:defmt-rtt",
    "dep:embassy-embedded-hal",
    "dep:embassy-executor",
    "dep:embassy-futures",
    "dep:embassy-net",
    "dep:embassy-rp",
    "dep:embassy-sync",
    "dep:embassy-time",
    "dep:embedded-io-async",
    "dep:panic-probe",
    "dep:static_cell",
    "embassy-executor/platform-cortex-m",
    "embassy-executor/executor-interrupt",
    "embassy-executor/defmt",
    "embassy-net/defmt",
    "embassy-time/defmt",
    "embassy-time/defmt-timestamp-uptime",
]

[dependencies]
scoreboard-basketball = { workspace = true }
scoreboard-config = { workspace = true }
scoreboard-hub75 = { workspace = true }
scoreboard-net = { workspace = true }

critical-section = { version = "1.1", features = [] }
heapless = { workspace = true }

tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "net"], optional = true }

cortex-m = { workspace = true, features = ["inline-asm"], optional = true }
cortex-m-rt = { workspace = true, optional = true }
cyw43 = { version = "0.7.0", features = ["defmt", "firmware-logs"], optional = true }
cyw43-pio = { version = "0.10.0", features = ["defmt"], optional = true }
defmt = { workspace = true, optional = true }
defmt-rtt = { workspace = true, optional = true }
embassy-embedded-hal = { version = "0.6.0", features = ["defmt"], optional = true }
embassy-executor = { version = "0.10.0", features = ["executor-thread"], optional = true }
embassy-futures = { version = "0.1.2", features = [], optional = true }
embassy-net = { version = "=0.9.0", features = ["tcp", "udp", "raw", "dhcpv4"], optional = true }
embassy-rp = { workspace = true, features = ["defmt", "unstable-pac", "time-driver", "critical-section-impl", "rp235xa", "binary-info"], optional = true }
embassy-sync = { version = "0.8.0", features = ["defmt"], optional = true }
embassy-time = { version = "0.5.1", features = [], optional = true }
embedded-io-async = { version = "0.7.0", features = ["defmt"], optional = true }
panic-probe = { version = "1.0.0", features = ["print-defmt"], optional = true }
static_cell = { version = "2.1", features = [], optional = true }

embedded-storage = { version = "0.3", optional = true }
esp-alloc = { version = "0.10", optional = true }
esp-bootloader-esp-idf = { version = "0.5", features = ["esp32s3"], optional = true }
esp-hal = { workspace = true, features = ["esp32s3"], optional = true }
esp-println = { version = "0.13", features = ["esp32s3", "log"], optional = true }
esp-radio = { version = "0.18", features = ["esp32s3", "wifi", "unstable"], optional = true }
esp-rtos = { version = "0.3", features = ["esp32s3", "esp-radio", "embassy"], optional = true }
esp-storage = { version = "0.9", features = ["esp32s3"], optional = true }
log = { version = "0.4", optional = true }
