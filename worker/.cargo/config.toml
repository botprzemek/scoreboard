[unstable]
build-std = ["core"]
build-std-features = ["panic_immediate_abort"]

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip RP235x --speed 12000"
linker = "flip-link"

[target.aarch64-unknown-linux-gnu]
runner = ["bash", "-c", 'ssh worker-1 "systemctl --user stop scoreboard-worker 2>/dev/null || true && mkdir -p ~/.local/bin && cat > ~/.local/bin/scoreboard-worker && chmod +x ~/.local/bin/scoreboard-worker && systemctl --user start scoreboard-worker" < "$0"']
linker = "aarch64-linux-gnu-gcc"

[env]
DEFMT_LOG = "debug,cyw43=off,embassy_net=off,smoltcp=off"