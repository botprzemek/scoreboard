[package]
name = "scoreboard-hmi"
version.workspace = true
edition.workspace = true

[features]
csr = ["leptos/csr"]
default = ["csr"]

[dependencies]
scoreboard-basketball = { workspace = true, features = ["serde"] }
scoreboard-config = { workspace = true, default-features = false }
scoreboard-net = { workspace = true, features = ["serde"] }

console_error_panic_hook = { version = "0.1.7" }
futures = { workspace = true }
js-sys = { version = "0.3.107" }
leptos = { version = "0.8.23", features = ["csr"] }
wasm-bindgen = { version = "0.2.105" }
wasm-bindgen-futures = { version = "0.4.55" }
web-sys = { workspace = true, features = [
    "BinaryType",
    "DomRect",
    "Element",
    "HtmlInputElement",
    "KeyboardEvent",
    "MessageEvent",
    "Storage",
    "WebSocket",
    "Window",
    "console",
] }
