[package]
name = "scoreboard-hub75"
version.workspace = true
edition.workspace = true

[features]
default = ["w64h32"]
w64h64 = []
w64h32 = []
w32h32 = []
esp32s3 = [
    "dep:esp-hal",
    "esp-hal/esp32s3",
    "esp-hal/unstable",
]
rp235x = [
    "dep:cortex-m",
    "dep:embassy-rp",
    "embassy-rp/rp235xa",
]
defmt = ["dep:defmt"]
serde = [
    "dep:serde",
    "serde/derive",
]

[dependencies]
cortex-m = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }
embassy-rp = { workspace = true, optional = true }
esp-hal = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
