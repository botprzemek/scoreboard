[package]
name = "scoreboard-master"
version.workspace = true
edition.workspace = true

[dependencies]
scoreboard-basketball = { workspace = true, features = ["serde"] }
scoreboard-config = { workspace = true, default-features = false }
scoreboard-net = { workspace = true, features = ["serde"] }

axum = { version = "0.8.9", features = ["ws"] }
futures = { workspace = true }
rand = { workspace = true }
redb = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
socket2 = "0.6.5"
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "fs", "signal"] }
tokio-util = "0.7"
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
