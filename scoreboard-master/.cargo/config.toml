[build]
target = "aarch64-unknown-linux-gnu"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"
runner = ["bash", "-c", 'ssh master-1 "systemctl --user stop scoreboard-master && cat > ~/.local/bin/scoreboard-master && chmod +x ~/.local/bin/scoreboard-master && systemctl --user start scoreboard-master" < "$0"']
